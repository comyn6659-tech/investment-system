<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投资分析系统 · 本机页面</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>投资分析系统</h1>
      <p class="tagline">本机页面 · 只读已提交数据 · 不访问外网 · 不构成投资建议</p>
    </div>
    <nav class="tabs" id="tabs" aria-label="页面部分">
      <button class="tab active" data-panel="ask">提问</button>
      <button class="tab" data-panel="overview">买点总览</button>
      <button class="tab" data-panel="pools">三个池</button>
      <button class="tab" data-panel="indices">指数</button>
      <button class="tab" data-panel="ledger">账本</button>
      <button class="tab" data-panel="status">数据状态</button>
    </nav>
  </header>

  <div id="alert-bar" class="alert-bar hidden" role="status" aria-live="polite"></div>

  <main>
    <section class="panel active" id="panel-ask">
      <form class="ask-form" id="ask-form">
        <input id="ask-input" type="text" autocomplete="off"
               placeholder="例如：招商银行怎么样 / 好公司里谁离买点最近 / 数据是哪天的" />
        <button type="submit">提问</button>
      </form>
      <div class="examples" id="ask-examples"></div>
      <p class="hint">与终端 <code>./ask</code> 同一个引擎：卡片文字逐字一致，数字与结论全部来自已批准规则与固定快照。</p>
      <div class="result" id="ask-result"></div>
    </section>

    <section class="panel" id="panel-overview">
      <div class="panel-head">
        <h2>买点总览</h2>
        <p class="hint" id="overview-summary"></p>
      </div>
      <div class="filters">
        <label>池 <select id="overview-pool"></select></label>
        <label>行业 <select id="overview-industry"></select></label>
        <label>所有制 <select id="overview-ownership"></select></label>
      </div>
      <div id="overview-body"></div>
    </section>

    <section class="panel" id="panel-pools">
      <div class="subtabs" id="pool-tabs"></div>
      <div class="filters">
        <label>搜索 <input id="pool-search" type="search" placeholder="代码 / 名称 / 行业" /></label>
        <label>行业 <select id="pool-industry"></select></label>
        <label>所有制 <select id="pool-ownership"></select></label>
        <label>周期 <select id="pool-cycle"></select></label>
      </div>
      <p class="hint" id="pool-meta"></p>
      <div id="pool-body"></div>
    </section>

    <section class="panel" id="panel-indices">
      <div class="panel-head">
        <h2>指数位置</h2>
        <p class="hint">指数只做位置说明：结论固定「无法判断」，不给买点或目标点位；走势只描述历史分位。</p>
      </div>
      <div id="indices-body"></div>
    </section>

    <section class="panel" id="panel-ledger">
      <div class="panel-head">
        <h2>结论账本</h2>
      </div>
      <form class="ask-form" id="ledger-form">
        <input id="ledger-input" type="text" list="ledger-companies" autocomplete="off"
               placeholder="输入公司名或 6 位代码（留空看全部）" />
        <datalist id="ledger-companies"></datalist>
        <button type="submit">查询</button>
      </form>
      <p class="hint" id="ledger-summary">账本只追加、旧记录不改；任一条可点「复算」。</p>
      <div id="ledger-body"></div>
      <div id="recompute-result"></div>
    </section>

    <section class="panel" id="panel-status">
      <div class="panel-head">
        <h2>数据状态</h2>
        <p class="hint">行情日期、上次自动更新时间与结果、下一次复核日期。</p>
      </div>
      <div id="status-body"></div>
    </section>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-tabs">
        <button id="modal-tab-card" class="active">卡片</button>
        <button id="modal-tab-score">成绩单</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
